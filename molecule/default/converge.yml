---
# Runs on top of the encrypted PKI prepare.yml created: bob is revoked and
# carol is new. alice is unchanged, so her encrypted files must stay as they are.
- name: Converge
  hosts: all
  # As in a play that also deploys the server: the role must not ask for sudo
  # on the controller.
  become: true
  gather_facts: false

  vars:
    openvpn_pki_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pki"
    openvpn_pki_ca_name: Molecule CA
    openvpn_pki_remote: 127.0.0.1
    openvpn_pki_clients:
      - name: alice
      - name: bob
        revoked: true
      - name: carol

  tasks:
    # Fully qualified (namespace from meta/main.yml): Molecule and ansible-lint
    # link the repo under this name, whatever the checkout directory is called.
    - name: Run the role under test
      ansible.builtin.import_role:
        name: homelab.openvpn_pki
