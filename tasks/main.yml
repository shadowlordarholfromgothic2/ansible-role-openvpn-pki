---
# Everything happens on the controller, once per play: the role can run in a
# play for localhost or in the play that deploys the VPN server. become is off
# so that a play with `become: true` does not ask for sudo on the controller.

- name: Create the OpenVPN PKI and the client profiles on the controller
  delegate_to: localhost
  run_once: true
  become: false
  block:
    # ==========================================================================
    # 1. FAIL FAST - validate input before touching anything
    # ==========================================================================

    - name: Validate the role input
      ansible.builtin.import_tasks:
        file: validate.yml
      tags: [always]

    # ==========================================================================
    # 2. KEYS - only the missing ones, an existing key is never replaced
    # ==========================================================================

    - name: Create the PKI directories and the missing keys
      ansible.builtin.import_tasks:
        file: keys.yml
      tags: [openvpn_pki, openvpn_pki_keys]

    # ==========================================================================
    # 3. CERTIFICATES - the CA, the server, the clients and the CRL
    # ==========================================================================

    - name: Issue the certificates and the revocation list
      ansible.builtin.import_tasks:
        file: certificates.yml
      tags: [openvpn_pki, openvpn_pki_certs]

    # ==========================================================================
    # 4. CLIENT PROFILES
    # ==========================================================================

    - name: Write the client profiles
      ansible.builtin.import_tasks:
        file: profiles.yml
      tags: [openvpn_pki, openvpn_pki_profiles]

    # ==========================================================================
    # 5. REPORT - what still has to be encrypted
    # ==========================================================================

    - name: Report the secrets in plain text
      ansible.builtin.import_tasks:
        file: report.yml
      tags: [openvpn_pki, openvpn_pki_report]
